[workspace]
resolver = "3"
members = [
    "crates/dns-proto",
    "crates/dns-zone",
    "crates/dns-cache",
    "crates/dns-metrics",
    "crates/dns-guard",
    "crates/dns-resolver",
    "crates/dns-xfr",
    "crates/dns-tsig",
    "crates/dns-dnssec",
    "crates/dns-tls",
    "crates/rdns",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dns-proto = { path = "crates/dns-proto" }
dns-zone = { path = "crates/dns-zone" }
dns-cache = { path = "crates/dns-cache" }
dns-metrics = { path = "crates/dns-metrics" }
dns-guard = { path = "crates/dns-guard" }
dns-resolver = { path = "crates/dns-resolver" }
dns-xfr = { path = "crates/dns-xfr" }
dns-tsig = { path = "crates/dns-tsig" }
dns-dnssec = { path = "crates/dns-dnssec" }
dns-tls = { path = "crates/dns-tls" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal", "sync"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
socket2 = { version = "0.5", features = ["all"] }
ring = "0.17"
rsa = "0.9"
rand = "0.8"
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.14"
base64 = "0.22"
rustls-pemfile = "2"
h2 = "0.4"
http = "1"
bytes = "1"

[profile.release]
lto = "thin"
