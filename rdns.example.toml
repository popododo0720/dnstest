# rdns configuration example. Start with: rdns --config rdns.example.toml

listen = "127.0.0.1:5300"
workers = 0            # 0 = one UDP worker per CPU core
zone_dir = "zones"     # *.zone files here are served; API changes persist here
zones = []             # extra zone files outside zone_dir
query_log = true       # per-query info logs; turn off under load

[recursion]
enabled = true
upstreams = ["1.1.1.1:53", "8.8.8.8:53"]   # failover order
allow = ["127.0.0.0/8", "10.0.0.0/8", "192.168.0.0/16", "::1/128"]

[cache]
max_entries = 100000

[rate_limit]
qps = 0                # per-client queries/sec; 0 = disabled
burst = 0

[api]
listen = "127.0.0.1:8081"
key = "changeme"       # X-API-Key header

[transfer]
allow = ["127.0.0.0/8"]        # networks allowed to AXFR our zones
notify = []                    # secondaries to NOTIFY on zone change

# Mirror a zone from a primary (AXFR + SOA refresh + NOTIFY):
# [[secondary]]
# zone = "example.org."
# primaries = ["10.0.0.1:53"]

# Conditional forwarding:
# [[forward]]
# zone = "corp.internal."
# upstreams = ["10.1.1.1:53"]

[rpz]
# file = "rpz.txt"             # `domain` = NXDOMAIN, `domain addr` = sinkhole
