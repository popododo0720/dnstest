# rdns configuration example. Start with: rdns --config rdns.example.toml

listen = "127.0.0.1:5300"
workers = 0            # 0 = one UDP worker per CPU core
zone_dir = "zones"     # *.zone files here are served; API changes persist here
zones = []             # extra zone files outside zone_dir
journal_dir = "journal"  # persistent IXFR journals (survive restart)
query_log = true       # per-query info logs; turn off under load

[recursion]
enabled = true
upstreams = ["1.1.1.1:53", "8.8.8.8:53"]   # failover order
allow = ["127.0.0.0/8", "10.0.0.0/8", "192.168.0.0/16", "::1/128"]
validate = false       # true = DNSSEC-validate forwarded answers (root anchor)

[cache]
max_entries = 100000

[rate_limit]
qps = 0                # per-client queries/sec; 0 = disabled
burst = 0

[api]
listen = "127.0.0.1:8081"
key = "changeme"       # X-API-Key header

[transfer]
allow = ["127.0.0.0/8"]        # networks allowed to AXFR our zones
notify = []                    # secondaries to NOTIFY on zone change

# Mirror a zone from a primary (AXFR + SOA refresh + NOTIFY):
# [[secondary]]
# zone = "example.org."
# primaries = ["10.0.0.1:53"]

# Conditional forwarding:
# [[forward]]
# zone = "corp.internal."
# upstreams = ["10.1.1.1:53"]

[rpz]
# file = "rpz.txt"             # `domain` = NXDOMAIN, `domain addr` = sinkhole

# --- TSIG keys (transfer authentication, RFC 8945) ---
# [[tsig_key]]
# name = "xfrkey."
# algorithm = "hmac-sha256"        # or hmac-sha512
# secret = "base64-encoded-secret"

# Require TSIG on outbound AXFR/IXFR:
# transfer.require_tsig = "xfrkey."
# Sign inbound transfers on a secondary:
# secondary.tsig_key = "xfrkey."

# --- DNSSEC online signing ---
[dnssec]
# key_file = "dnssec.keys"         # `alg:base64` lines (ksk/zsk); auto-generated
# zones = ["example.lab."]         # origins to sign online
# algorithm = "ecdsap256"          # ed25519, ecdsap256, or rsasha256
# validity_days = 14
# nsec3 = false                    # true = NSEC3 hashed denial instead of NSEC
# nsec3_iterations = 0
# nsec3_salt = ""                  # hex

# --- DNS-over-TLS (RFC 7858) and DNS-over-HTTPS (RFC 8484) ---
[tls]
# cert = "cert.pem"                # omit for a self-signed dev cert
# key = "key.pem"
# self_signed_names = ["dns.example.lab"]
# dot_listen = "0.0.0.0:853"
# doh_listen = "0.0.0.0:443"       # HTTP/2 (ALPN h2) + HTTP/1.1
